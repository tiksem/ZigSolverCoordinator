[project]
name = "zigsolver-coordinator"
version = "0.1.0"
description = "Prepares every table snapshot for ZigSolver and keeps the settings; ZigSolverFront talks to it over one WebSocket."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "websockets>=14",
    "httpx>=0.27",
    "cryptography>=42",
]

[project.scripts]
zigsolver-coordinator = "zigsolver_coordinator.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zigsolver_coordinator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
